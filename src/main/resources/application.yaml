spring:
  application:
    name: gym-management-system

  datasource:
    url: jdbc:mysql://localhost:3306/gym_management_system?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  
  data:
    redis:
      host: localhost
      port: 6379
      # password: your_password
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  type-aliases-package: com.gym.pojo

logging:
  level:
    org.springframework.cache: TRACE
    com.gym.mapper: DEBUG
